# Canal de exemplo. Copie com `fabrica new <slug>` e edite.
slug: exemplo-terror
name: Relatos do Andar 7
enabled: true

youtube:
  channel_id: UCxxxxxxxxxxxxxxxxxxxx
  oauth_token: secrets/exemplo-terror/token.json      # gerado por `fabrica auth-youtube exemplo-terror`
  client_secrets: secrets/client_secret.json          # baixado do Google Cloud (um para todos os canais)
  category_id: "24"                                   # Entretenimento
  playlist_id: null
  made_for_kids: false
  synthetic_media: true
  default_language: pt-BR

schedule:
  cron: "0 14 * * *"          # usado pelo n8n/cron para disparar; 1 vídeo por dia às 14h
  publish_delay_min: 30
  timezone: America/Sao_Paulo

content:
  language: pt-BR
  niche: "relatos de lugares vazios e regras estranhas (terror liminal)"
  tone: "narrador calmo, tensão lenta, sem susto barato"
  audience: "adultos que gostam de creepypasta e mistério"
  avoid:
    - "crimes reais com nomes de pessoas"
    - "marcas e empresas reais"
    - "a palavra Backrooms e nomes de níveis da comunidade"
  format: short               # short = 1080x1920 | long = 1920x1080
  duration_s: 50

video:
  engine: lemo-opuscar
  style: backrooms            # Liminal Found Footage; ou um estilo salvo seu, ex. "my:andar7"
  voice:
    engine: edge-tts
    id: pt-BR-AntonioNeural
    speed: 0.95
  timeout_min: 90

metadata:
  fixed_hashtags: ["#terror", "#liminal"]
  fixed_tags: ["terror", "relato de terror"]
  description_footer: "Inscreva-se para mais relatos do Andar 7."

thumbnail:
  enabled: true
  provider: fal
  model: fal-ai/flux-pro/v1.1
  variants: 3
  style_prompt: "found footage still, empty fluorescent-lit office corridor, sickly yellow-green, VHS grain, high contrast"
  use_video_ref: false        # true quando o modelo escolhido aceitar imagem de referência
  text:
    max_words: 4
    font: null                # ex. fonts/Anton-Regular.ttf (fonte livre)
    color: "#F2E9C9"
    stroke: "#000000"
  badge: null                 # ex. channels/exemplo-terror/badge.png
  keep_clear: bottom-right
  min_score: 7
