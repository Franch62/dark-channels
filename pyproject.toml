[project]
name = "fabrica"
version = "0.1.0"
description = "Pipeline multi-canal de vídeos dark: roteiro, vídeo, metadados, thumbnail e upload agendado no YouTube."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "anthropic>=2.3",
  "pillow>=10",
  "httpx>=0.27",
]

[project.optional-dependencies]
youtube = ["google-api-python-client>=2.130", "google-auth-oauthlib>=1.2"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8"]

[project.scripts]
fabrica = "fabrica.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fabrica"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
